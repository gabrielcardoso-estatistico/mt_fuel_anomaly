<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360"><rect width="100%" height="100%" fill="white"/><style>text{font-family:Arial;fill:#222}.t{font-size:26px;font-weight:bold}.h{font-size:17px;font-weight:bold}.v{font-size:17px}.box{fill:#f8fafc;stroke:#cbd5e1}</style><text x="40" y="42" class="t">Top anomaly case study — Sinop</text><rect x="40" y="75" width="820" height="230" rx="12" class="box"/><text x="70" y="115" class="h">Observed price</text><text x="300" y="115" class="v">R$ 6.99/L</text><text x="70" y="150" class="h">Municipal median</text><text x="300" y="150" class="v">R$ 6.89/L</text><text x="70" y="185" class="h">Deviation from median</text><text x="300" y="185" class="v">+1.45%</text><text x="70" y="220" class="h">Historical z-score</text><text x="300" y="220" class="v">2.21</text><text x="500" y="115" class="h">Isolation Forest pct.</text><text x="735" y="115" class="v">0.9999</text><text x="500" y="150" class="h">LOF pct.</text><text x="735" y="150" class="v">0.9973</text><text x="500" y="185" class="h">One-Class SVM pct.</text><text x="735" y="185" class="v">0.9996</text><text x="500" y="220" class="h">Autoencoder pct.</text><text x="735" y="220" class="v">0.9994</text><text x="70" y="270" class="h">Key insight:</text><text x="175" y="270" class="v">the anomaly is driven by multivariate history, not price level alone.</text></svg>